[ssh_connection]
pipelining=True
# ServerAliveInterval/CountMax so a silently dead session is detected in ~90s.
# ConnectionAttempts only covers *establishing* a connection, and `timeout` below is
# the connect timeout -- neither notices an established session that stops receiving.
# Without a liveness probe, ssh waits on the channel until TCP gives up, and because
# the linear strategy waits for every host, one dead connection stalls the whole play.
# Seen against the packet.ai B200 nodes: two sessions with nothing running remotely
# and idle hosts, ansible blocked ~9 minutes until the clients were killed by hand,
# after which it reconnected on its own.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o UserKnownHostsFile=/dev/null
#control_path = ~/.ssh/ansible-%%r@%%h:%%p
[defaults]
# https://github.com/ansible/ansible/issues/56930 (to ignore group names with - and .)
force_valid_group_names = ignore

host_key_checking=False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp
fact_caching_timeout = 86400
timeout = 300
stdout_callback = default
display_skipped_hosts = no
library = ./library
callbacks_enabled = profile_tasks
roles_path = roles:$VIRTUAL_ENV/usr/local/share/kubespray/roles:$VIRTUAL_ENV/usr/local/share/ansible/roles:/usr/share/kubespray/roles
deprecation_warnings=False
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .creds, .gpg
[inventory]
ignore_patterns = artifacts, credentials
